name: Build USB Rescue Toolkit
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare dist and icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item index.html dist/index.html -Force
          Copy-Item -Recurse src dist/src -Force
          Copy-Item usb_rescue_icon.png src-tauri/icons/icon.png -Force
          pip install pillow
          python -c "from PIL import Image; im=Image.open('usb_rescue_icon.png'); im.save('src-tauri/icons/icon.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
      - run: npm install
      - run: npx tauri build
      - name: List bundle
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Rescue-Toolkit-exe
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
          if-no-files-found: warn
