name: Build USB Rescue Toolkit
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Create icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons
          Copy-Item usb_rescue_icon.png src-tauri/icons/icon.png -Force
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Rescue-Toolkit-exe
          path: src-tauri/target/release/bundle/
